[package]
name = "hmg"
description = "HiveMe GUI: watch the MQTT broker, keep a local history, and raise notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary name, which
# only matters on Windows. See https://github.com/rust-lang/cargo/issues/8519.
name = "hmg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hmg"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
env_logger = { workspace = true }
# Everything between the broker and the window is the shared session, which brings
# the history database, and the bundled SQLite library, with it.
hiveme-core = { workspace = true, features = ["session", "desktop"] }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri's AppIndicator backend cannot report left-click activation. StatusNotifier
# handles activation and detects desktops without a tray before hiding the window.
ksni = "0.3.6"

[dev-dependencies]
tempfile = { workspace = true }
