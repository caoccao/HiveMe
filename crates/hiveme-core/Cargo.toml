[package]
name = "hiveme-core"
description = "Shared core of the HiveMe applications: config, message format, topics, rules, MQTT, storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enabled by hmg only; pulls in the bundled SQLite library.
storage = ["dep:rusqlite"]
# Enabled once the HiveMQ Cloud REST client lands in phase 6.
cloud-api = []
# MQTT over WebSocket. Off by default because HiveMQ Cloud serves plain MQTT over
# TLS on 8883 and the extra transport pulls in a WebSocket stack. See
# docs/specs/hivemq-cloud.md.
websocket = ["rumqttc/websocket"]

[dependencies]
chrono = { workspace = true }
hostname = { workspace = true }
log = { workspace = true }
rumqttc = { workspace = true }
rusqlite = { workspace = true, optional = true }
rustls-native-certs = { workspace = true }
rustls-pemfile = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The storage tests need the feature the GUI turns on.
hiveme-core = { workspace = true, features = ["storage"] }
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
