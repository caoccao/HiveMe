[package]
name = "hiveme-core"
description = "Shared core of the HiveMe applications: config, message format, topics, rules, MQTT, storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = ["session", "dep:testcontainers", "dep:tempfile"]
default = []
# The message history; pulls in the bundled SQLite library.
storage = ["dep:rusqlite"]
# The backend both applications run on: broker connection, history, notification
# rules, the config in memory, and the update check. See docs/specs/session.md.
session = ["storage", "i18n", "dep:ureq"]
# The languages of hmc: the catalogs in locales/, plural rules, and formatting. See
# docs/specs/tui.md, "Languages".
i18n = []
# Enabled once the HiveMQ Cloud REST client lands in phase 6.
cloud-api = []
# MQTT over WebSocket. Off by default because HiveMQ Cloud serves plain MQTT over
# TLS on 8883 and the extra transport pulls in a WebSocket stack. See
# docs/specs/hivemq-cloud.md.
websocket = ["rumqttc/websocket"]

[dependencies]
testcontainers = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
chrono = { workspace = true }
hostname = { workspace = true }
log = { workspace = true }
rumqttc = { workspace = true }
rusqlite = { workspace = true, optional = true }
rustls-native-certs = { workspace = true }
rustls-pemfile = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true, optional = true }
uuid = { workspace = true }

[dev-dependencies]
# The storage, session, and catalog tests need the features the applications turn on.
hiveme-core = { workspace = true, features = ["i18n", "session", "test-support"] }
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = { workspace = true }
