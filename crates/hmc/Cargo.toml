[package]
name = "hmc"
description = "HiveMe CLI: send a message to the MQTT broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hmc"
path = "src/main.rs"

# Windows reads an icon out of the executable itself, so build.rs puts one there.
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[dependencies]
# The copy actions of the chat view; OSC 52 covers a terminal with no native clipboard.
arboard = { workspace = true }
# `string` lets the help carry headings from the catalogs rather than only literals.
clap = { workspace = true, features = ["string"] }
crossterm = { workspace = true }
env_logger = { workspace = true }
futures-core = { workspace = true }
# The terminal UI runs on the session `hmg` runs on, which brings the history database,
# and the bundled SQLite library, with it.
hiveme-core = { workspace = true, features = ["i18n", "session", "desktop"] }
log = { workspace = true }
open = { workspace = true }
ratatui = { workspace = true }
# `serde` reads a payload into a JSON tree that keeps its keys in the order written.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `signal`: closing the terminal and SIGTERM leave the terminal UI through its quit path.
tokio = { workspace = true, features = ["signal"] }
unicode-width = { workspace = true }

[dev-dependencies]
hiveme-core = { workspace = true, features = ["test-support"] }
assert_cmd = { workspace = true }
# tests/tui.rs: the terminal UI in a pseudo-terminal, read back as a screen.
portable-pty = { workspace = true }
predicates = { workspace = true }
# tests/tui.rs asks the broker whether a client identifier still has a session.
rumqttc = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
# `test-util` pauses the clock, so the shutdown timeout is tested without waiting it out.
tokio = { workspace = true, features = ["test-util"] }
vt100 = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
