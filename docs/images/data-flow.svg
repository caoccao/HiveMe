<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" role="img" aria-labelledby="title desc">
  <title id="title">HiveMe data flow</title>
  <desc id="desc">hmc and hmg each hold their own MQTT session with a HiveMQ Cloud cluster, publishing to and receiving from topics under hiveme. On the same machine they share one config file, HiveMe.json, which carries the broker, the subscriptions, and the notification rules, and one local cache, HiveMe.db, which holds the message history. A message that matches a notification rule raises an OS notification or the topmost window.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3a2410; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .b { font-weight: 700; }
    .m { fill: #7a5a3c; }
    .cap { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; fill: #d35400; }
    .bg { fill: #fff8f0; }
    .card { fill: #ffffff; stroke: #f5c99b; stroke-width: 1.5; }
    .cloud { fill: #fff0de; stroke: #f57c00; stroke-width: 2; }
    .pill { fill: #ffffff; stroke: #f57c00; stroke-width: 2; }
    .inset { fill: #fff4e8; stroke: #f5c99b; stroke-width: 1; }
    .divider { stroke: #f5c99b; stroke-width: 1; }
    .machine { fill: none; stroke: #f0b27a; stroke-width: 1.5; stroke-dasharray: 7 6; }
    .flow { fill: none; stroke: #f57c00; stroke-width: 2.5; stroke-linejoin: round; }
    .local { fill: none; stroke: #b08968; stroke-width: 2; }
    .head-flow { fill: #f57c00; }
    .head-local { fill: #b08968; }
    .term { fill: #3a2410; }
    .term-text { fill: #ffd8a8; }
    .term-note { fill: #b89878; }
    .glyph { fill: #ffffff; }
    .glyph-mark { fill: #bf360c; stroke: #bf360c; }
    .tree { fill: #f0b27a; }
    .bubble-in { fill: #f5e1cc; }
    .bubble-out { fill: #f57c00; }
    .chip-info { fill: #f3e9df; } .chip-info-t { fill: #5d4037; }
    .chip-success { fill: #e3f4e4; } .chip-success-t { fill: #2e7d32; }
    .chip-warn { fill: #fff1c7; } .chip-warn-t { fill: #8a5a00; }
    .chip-error { fill: #fde4e1; } .chip-error-t { fill: #c62828; }
    @media (prefers-color-scheme: dark) {
      text { fill: #fbebdd; }
      .m { fill: #c9a889; }
      .cap { fill: #ffb74d; }
      .bg { fill: #1e140c; }
      .card { fill: #2b1d12; stroke: #6b4423; }
      .cloud { fill: #3a2412; stroke: #ff9800; }
      .pill { fill: #2b1d12; stroke: #ff9800; }
      .inset { fill: #342316; stroke: #6b4423; }
      .divider { stroke: #6b4423; }
      .machine { stroke: #8a5428; }
      .flow { stroke: #ff9800; }
      .local { stroke: #a0785a; }
      .head-flow { fill: #ff9800; }
      .head-local { fill: #a0785a; }
      .term { fill: #120b06; }
      .tree { fill: #8a5428; }
      .bubble-in { fill: #4a3322; }
      .bubble-out { fill: #ff9800; }
      .chip-info { fill: #3a2a1e; } .chip-info-t { fill: #e6d3c1; }
      .chip-success { fill: #173a1c; } .chip-success-t { fill: #8fd694; }
      .chip-warn { fill: #3d2e05; } .chip-warn-t { fill: #ffd54f; }
      .chip-error { fill: #45171a; } .chip-error-t { fill: #ff8a80; }
    }
  </style>
  <defs>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc94d"/>
      <stop offset="1" stop-color="#f57c00"/>
    </linearGradient>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path class="head-flow" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
    <marker id="arrow-local" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="head-local" d="M0,0 L10,5 L0,10 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="710" rx="18"/>

  <!-- HiveMQ Cloud -->
  <rect class="cloud" x="300" y="24" width="400" height="222" rx="14"/>
  <g transform="translate(336 60)">
    <path d="M0,-19 L16.5,-9.5 L16.5,9.5 L0,19 L-16.5,9.5 L-16.5,-9.5 Z" fill="url(#honey)" stroke="#e65100" stroke-width="1.5"/>
    <path class="glyph" d="M-7.5,5 a4.5,4.5 0 0 1 0.6,-9 a6,6 0 0 1 11.2,-1.2 a4.2,4.2 0 0 1 3.4,10.2 Z"/>
  </g>
  <text x="364" y="57" font-size="20" class="b">HiveMQ Cloud</text>
  <text x="364" y="77" font-size="12" class="m">Serverless cluster · MQTT 5 over TLS, port 8883</text>
  <line class="divider" x1="320" y1="94" x2="680" y2="94"/>
  <text x="320" y="114" class="cap">SAMPLE TOPICS</text>

  <text x="320" y="139" font-size="12.5" class="mono">hiveme</text>
  <rect class="chip-info" x="470" y="126" width="54" height="18" rx="9"/>
  <text x="497" y="139" font-size="10.5" text-anchor="middle" class="b chip-info-t">info</text>
  <text x="534" y="139" font-size="12.5">Build finished</text>

  <text x="320" y="165" font-size="12.5" class="mono">hiveme/build/ci</text>
  <rect class="chip-error" x="470" y="152" width="54" height="18" rx="9"/>
  <text x="497" y="165" font-size="10.5" text-anchor="middle" class="b chip-error-t">error</text>
  <text x="534" y="165" font-size="12.5">Nightly build failed</text>

  <text x="320" y="191" font-size="12.5" class="mono">hiveme/backup/nas</text>
  <rect class="chip-warn" x="470" y="178" width="54" height="18" rx="9"/>
  <text x="497" y="191" font-size="10.5" text-anchor="middle" class="b chip-warn-t">warn</text>
  <text x="534" y="191" font-size="12.5">Disk at 87%</text>

  <text x="320" y="226" font-size="11.5" class="m">Topics are relative: <tspan class="mono">-t build/ci</tspan> → <tspan class="mono">hiveme/build/ci</tspan></text>

  <!-- MQTT flows, hmc -->
  <path class="flow" d="M124,310 V110 H300" marker-end="url(#arrow-flow)"/>
  <path class="flow" d="M300,150 H164 V310" marker-end="url(#arrow-flow)"/>
  <text x="212" y="102" font-size="11.5" text-anchor="middle" class="m">publish</text>
  <text x="232" y="168" font-size="11.5" text-anchor="middle" class="m">deliver</text>

  <!-- MQTT flows, hmg -->
  <path class="flow" d="M876,310 V110 H700" marker-end="url(#arrow-flow)"/>
  <path class="flow" d="M700,150 H836 V310" marker-end="url(#arrow-flow)"/>
  <text x="788" y="102" font-size="11.5" text-anchor="middle" class="m">publish</text>
  <text x="768" y="168" font-size="11.5" text-anchor="middle" class="m">deliver</text>

  <!-- MQTT session labels -->
  <rect class="pill" x="34" y="190" width="220" height="74" rx="12"/>
  <text x="144" y="212" font-size="13" text-anchor="middle" class="b">MQTT session</text>
  <text x="144" y="231" font-size="10.5" text-anchor="middle" class="mono m">hiveme-hmc-&lt;device&gt;-&lt;random&gt;</text>
  <text x="144" y="251" font-size="11.5" text-anchor="middle" class="m">publish · TUI subscribes hiveme/#</text>

  <rect class="pill" x="746" y="190" width="220" height="74" rx="12"/>
  <text x="856" y="212" font-size="13" text-anchor="middle" class="b">MQTT session</text>
  <text x="856" y="231" font-size="10.5" text-anchor="middle" class="mono m">hiveme-hmg-&lt;device&gt;</text>
  <text x="856" y="251" font-size="11.5" text-anchor="middle" class="m">publish · subscribe hiveme/#</text>

  <!-- This machine -->
  <rect class="machine" x="12" y="290" width="976" height="408" rx="16"/>
  <rect class="bg" x="424" y="279" width="152" height="22" rx="11"/>
  <text x="500" y="294" text-anchor="middle" class="cap">THIS MACHINE</text>

  <!-- hmc -->
  <rect class="card" x="24" y="310" width="240" height="250" rx="14"/>
  <g transform="translate(60 344)">
    <path d="M0,-19 L16.5,-9.5 L16.5,9.5 L0,19 L-16.5,9.5 L-16.5,-9.5 Z" fill="url(#honey)" stroke="#e65100" stroke-width="1.5"/>
    <rect class="glyph" x="-10" y="-6.5" width="20" height="13" rx="3"/>
    <path class="glyph-mark" d="M-6.5,-3 L-2.5,0 L-6.5,3" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line class="glyph-mark" x1="-0.5" y1="3.2" x2="5.5" y2="3.2" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="88" y="343" font-size="20" class="mono b">hmc</text>
  <text x="88" y="362" font-size="12" class="m">CLI and terminal UI</text>
  <rect class="term" x="40" y="380" width="208" height="60" rx="8"/>
  <text x="52" y="404" font-size="11.5" class="mono term-text">$ hmc "Build finished"</text>
  <text x="52" y="426" font-size="11.5" class="mono term-text">$ hmc <tspan class="term-note"># terminal UI</tspan></text>
  <text x="44" y="470" font-size="12">• Publishes from shells, scripts</text>
  <text x="44" y="492" font-size="12">• Terminal UI with every GUI feature</text>
  <text x="44" y="514" font-size="12">• Works over SSH, no desktop</text>

  <!-- hmg -->
  <rect class="card" x="736" y="310" width="240" height="250" rx="14"/>
  <g transform="translate(772 344)">
    <path d="M0,-19 L16.5,-9.5 L16.5,9.5 L0,19 L-16.5,9.5 L-16.5,-9.5 Z" fill="url(#honey)" stroke="#e65100" stroke-width="1.5"/>
    <path class="glyph" d="M-9,-7 H9 a2.5,2.5 0 0 1 2.5,2.5 V3 a2.5,2.5 0 0 1 -2.5,2.5 H-3 L-7,9.5 V5.5 H-9 a2.5,2.5 0 0 1 -2.5,-2.5 V-4.5 a2.5,2.5 0 0 1 2.5,-2.5 Z"/>
    <circle class="glyph-mark" cx="-5" cy="-0.8" r="1.5"/>
    <circle class="glyph-mark" cx="0" cy="-0.8" r="1.5"/>
    <circle class="glyph-mark" cx="5" cy="-0.8" r="1.5"/>
  </g>
  <text x="800" y="343" font-size="20" class="mono b">hmg</text>
  <text x="800" y="362" font-size="12" class="m">Desktop GUI</text>
  <rect class="inset" x="752" y="380" width="208" height="60" rx="8"/>
  <rect class="tree" x="762" y="391" width="40" height="6" rx="3"/>
  <rect class="tree" x="770" y="404" width="34" height="6" rx="3"/>
  <rect class="tree" x="770" y="417" width="28" height="6" rx="3"/>
  <line class="divider" x1="814" y1="386" x2="814" y2="434"/>
  <rect class="bubble-in" x="824" y="390" width="92" height="16" rx="8"/>
  <rect class="bubble-out" x="866" y="414" width="84" height="16" rx="8"/>
  <text x="756" y="470" font-size="12">• Topic tree and chat view</text>
  <text x="756" y="492" font-size="12">• Publishes from the composer</text>
  <text x="756" y="514" font-size="12">• Linux, macOS, and Windows</text>

  <!-- Shared config -->
  <rect class="card" x="344" y="310" width="312" height="170" rx="14"/>
  <g transform="translate(372 332)">
    <path d="M-8,-11 H3 L9,-5 V11 H-8 Z" fill="url(#honey)" stroke="#e65100" stroke-width="1.2" stroke-linejoin="round"/>
    <path class="glyph" d="M-4,-1 H5 V1 H-4 Z M-4,4 H5 V6 H-4 Z"/>
  </g>
  <text x="392" y="338" font-size="15" class="mono b">HiveMe.json</text>
  <text x="640" y="337" text-anchor="end" class="cap">SHARED CONFIG</text>
  <text x="364" y="364" font-size="11.5" class="mono m">broker</text>
  <text x="426" y="364" font-size="11.5" class="mono">mqtts://….hivemq.cloud:8883</text>
  <text x="364" y="384" font-size="11.5" class="mono m">topics</text>
  <text x="426" y="384" font-size="11.5" class="mono">subscriptions ["#"]</text>
  <line class="divider" x1="364" y1="398" x2="636" y2="398"/>
  <text x="364" y="419" font-size="12.5" class="b">Notification rules</text>
  <rect class="chip-info" x="364" y="429" width="58" height="18" rx="9"/>
  <text x="393" y="442" font-size="10.5" text-anchor="middle" class="b chip-info-t">info</text>
  <rect class="chip-success" x="430" y="429" width="58" height="18" rx="9"/>
  <text x="459" y="442" font-size="10.5" text-anchor="middle" class="b chip-success-t">success</text>
  <rect class="chip-warn" x="496" y="429" width="58" height="18" rx="9"/>
  <text x="525" y="442" font-size="10.5" text-anchor="middle" class="b chip-warn-t">warn</text>
  <rect class="chip-error" x="562" y="429" width="58" height="18" rx="9"/>
  <text x="591" y="442" font-size="10.5" text-anchor="middle" class="b chip-error-t">error</text>
  <text x="364" y="467" font-size="11.5" class="m">Match a topic filter and a level → notify</text>

  <!-- Shared local cache -->
  <rect class="card" x="344" y="500" width="312" height="60" rx="14"/>
  <g transform="translate(372 530)">
    <path d="M-9,-8 V8 A9,3.5 0 0 0 9,8 V-8 Z" fill="url(#honey)" stroke="#e65100" stroke-width="1.2"/>
    <ellipse cx="0" cy="-8" rx="9" ry="3.5" fill="#ffc94d" stroke="#e65100" stroke-width="1.2"/>
    <path d="M-9,0 A9,3.5 0 0 0 9,0" fill="none" stroke="#e65100" stroke-width="1.2"/>
  </g>
  <text x="392" y="527" font-size="15" class="mono b">HiveMe.db</text>
  <text x="640" y="526" text-anchor="end" class="cap">SHARED LOCAL CACHE</text>
  <text x="392" y="546" font-size="11.5" class="m">Message history · unread counts · SQLite</text>

  <!-- Local reads and writes -->
  <path class="local" d="M266,395 H342" marker-start="url(#arrow-local)" marker-end="url(#arrow-local)"/>
  <text x="304" y="386" font-size="10.5" text-anchor="middle" class="m">read · write</text>
  <path class="local" d="M266,530 H342" marker-start="url(#arrow-local)" marker-end="url(#arrow-local)"/>
  <text x="304" y="521" font-size="10.5" text-anchor="middle" class="m">store · load</text>
  <path class="local" d="M734,395 H658" marker-start="url(#arrow-local)" marker-end="url(#arrow-local)"/>
  <text x="696" y="386" font-size="10.5" text-anchor="middle" class="m">read · write</text>
  <path class="local" d="M734,530 H658" marker-start="url(#arrow-local)" marker-end="url(#arrow-local)"/>
  <text x="696" y="521" font-size="10.5" text-anchor="middle" class="m">store · load</text>

  <!-- Notifications -->
  <path class="flow" d="M144,560 V640 H344" marker-end="url(#arrow-flow)"/>
  <text x="244" y="631" font-size="11.5" text-anchor="middle" class="m">rule matched</text>
  <path class="flow" d="M856,560 V640 H656" marker-end="url(#arrow-flow)"/>
  <text x="756" y="631" font-size="11.5" text-anchor="middle" class="m">rule matched</text>

  <rect class="card" x="344" y="596" width="312" height="88" rx="14"/>
  <text x="500" y="616" text-anchor="middle" class="cap">OS NOTIFICATION · TOPMOST WINDOW</text>
  <rect class="inset" x="364" y="626" width="272" height="46" rx="10"/>
  <g transform="translate(390 649)">
    <path d="M0,-14 L12.1,-7 L12.1,7 L0,14 L-12.1,7 L-12.1,-7 Z" fill="url(#honey)" stroke="#e65100" stroke-width="1.2"/>
    <path class="glyph" d="M-6.5,-5 H6.5 a1.8,1.8 0 0 1 1.8,1.8 V2 a1.8,1.8 0 0 1 -1.8,1.8 H-2 L-5,7 V3.8 H-6.5 a1.8,1.8 0 0 1 -1.8,-1.8 V-3.2 a1.8,1.8 0 0 1 1.8,-1.8 Z"/>
  </g>
  <text x="414" y="645" font-size="12.5" class="b">Nightly build failed</text>
  <text x="414" y="662" font-size="11" class="m"><tspan class="mono">hiveme/build/ci</tspan> · error rule</text>
</svg>
