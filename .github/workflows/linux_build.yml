name: Linux Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - .github/**
      - "!.github/workflows/linux_build.yml"
      - "**.md"
      - "docs/**"
  push:
    paths-ignore:
      - .github/**
      - "!.github/workflows/linux_build.yml"
      - "**.md"
      - "docs/**"

env:
  HIVEME_VERSION: 0.1.0

jobs:
  build_package:
    name: Build for Linux x86_64
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout the code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 11

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Install Linux packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-dev librsvg2-dev webkit2gtk-driver xvfb

    - name: Type check the Deno scripts
      run: deno task -c scripts/ts/deno.json check

    - name: Check license headers
      run: deno task -c scripts/ts/deno.json check-license-headers

    - name: Check specification sync
      env:
        SPEC_SYNC_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        SPEC_SYNC_EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'spec-sync-exempt') && '1' || '0' }}
      run: deno task -c scripts/ts/deno.json check-spec-sync

    - name: Check Rust formatting
      run: cargo fmt --all -- --check

    - name: Build hmc, which hmg bundles
      run: cargo build -r -p hmc

    - name: Lint Rust
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Validate the specification examples
      run: cargo xtask check-spec

    - name: Check that the schemas are current
      run: |
        cargo xtask schema
        # Only the generated files, so that editing schemas/README.md does not look
        # like a stale schema.
        git diff --exit-code -- 'schemas/*.schema.json' || {
          echo "schemas/ is stale, run 'cargo xtask schema' and commit the result" >&2
          exit 1
        }

    - name: Install the frontend dependencies
      run: pnpm install --frozen-lockfile

    - name: Check that the generated types are current
      run: |
        deno task -c scripts/ts/deno.json gen-types
        git diff --exit-code -- src/generated || {
          echo "src/generated/ is stale, run 'pnpm gen:types' and commit the result" >&2
          exit 1
        }

    - name: Typecheck the frontend
      run: pnpm typecheck

    - name: Test the frontend
      run: pnpm test

    - name: Test HiveMe
      run: cargo test -r --workspace

    - name: Build HiveMe
      run: pnpm tauri build

    - name: Install the native GUI test driver
      run: cargo install tauri-driver --version 2.0.6 --locked

    - name: Test hmc and hmg end to end
      timeout-minutes: 10
      run: xvfb-run -a pnpm test:e2e --release

    - name: Upload end-to-end diagnostics
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: HiveMe-linux-e2e-diagnostics
        path: target/e2e/
        if-no-files-found: ignore

    - name: Upload hmc
      uses: actions/upload-artifact@v7
      with:
        name: HiveMe-linux-x86_64-${{ env.HIVEME_VERSION }}-hmc
        path: |
          target/release/hmc

    - name: Upload the deb
      uses: actions/upload-artifact@v7
      with:
        name: HiveMe-linux-x86_64-${{ env.HIVEME_VERSION }}-deb
        path: |
          target/release/bundle/deb/*.deb

    - name: Upload the rpm
      uses: actions/upload-artifact@v7
      with:
        name: HiveMe-linux-x86_64-${{ env.HIVEME_VERSION }}-rpm
        path: |
          target/release/bundle/rpm/*.rpm

    - name: Upload the AppImage
      uses: actions/upload-artifact@v7
      with:
        name: HiveMe-linux-x86_64-${{ env.HIVEME_VERSION }}-AppImage
        path: |
          target/release/bundle/appimage/*.AppImage
