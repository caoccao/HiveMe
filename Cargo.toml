[workspace]
resolver = "3"
members = [
  "crates/hiveme-core",
  "crates/hmc",
  "src-tauri",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Sam Cao"]
license = "Apache-2.0"
repository = "https://github.com/caoccao/HiveMe"
homepage = "https://github.com/caoccao/HiveMe"

# Shared dependency versions. A crate opts in with `foo = { workspace = true }`,
# so an entry here costs nothing until a member uses it.
[workspace.dependencies]
anyhow = "1.0.102"
# The clipboard of the hmc terminal UI. No image support: only text is copied, and the
# image feature would bring an image decoder along.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
assert_cmd = "2.2"
chrono = "0.4.45"
clap = { version = "4.6", features = ["derive"] }
# The terminal backend of the hmc terminal UI; `event-stream` lets its key events be
# awaited beside the session events.
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
env_logger = "0.11"
futures-core = "0.3"
hostname = "0.4"
jsonschema = "0.56"
# Unix only, in the hmc pseudo-terminal test: a non-blocking read of the terminal side.
libc = "0.2"
log = "0.4"
# Linux and macOS only: the OS notifications of the hmc terminal UI.
notify-rust = "4.18"
mac-usernotifications = "0.3.1"
# macOS only, in xtask: NSWorkspace gives a built binary the Finder icon that a bundle
# would have carried for it.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
open = "5.4"
# The pseudo-terminal the hmc end-to-end test runs the terminal UI in: openpty on Unix,
# ConPTY on Windows.
portable-pty = "0.9"
predicates = "3.1"
ratatui = "0.30"
rumqttc = { version = "0.25", features = ["use-rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.5", features = [] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2"
# Windows only: the toast API, and the registry key that gives it an application
# identity so the notification is labeled HiveMe rather than PowerShell.
tauri-winrt-notification = "0.7"
windows-registry = "0.6"
tempfile = "3.27"
# Default features pull in rustls/ring, which would make two crypto providers
# compiled in at once and rustls refuses to pick one. Match rumqttc instead.
testcontainers = { version = "0.28", default-features = false, features = ["aws-lc-rs"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Display widths, so that CJK labels are cut by the cells they take.
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1.26", features = ["v7", "serde"] }
# Reads what the terminal UI wrote to the pseudo-terminal back into a screen of cells.
vt100 = "0.16"
# Windows only: puts the icon and the version information inside hmc.exe.
winresource = "0.1"

[workspace.dependencies.hiveme-core]
path = "crates/hiveme-core"

[profile.release]
strip = true
